<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/riso.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Riso - Project generator for Python, TypeScript, Rust & Go. Configure and scaffold production-ready projects with CLI, API, MCP, Docs, and SaaS modules." />
    <title>Riso - Project Generator</title>
    <script>
      (function () {
        try {
          var key = 'riso-dark-mode'
          var saved = localStorage.getItem(key)
          var dark =
            saved === 'true' ||
            (saved === null && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* ignore */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
