name: Release

on:
  push:
    branches:
      - main
      - beta
      - alpha
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no actual release)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel releases in progress

permissions:
  contents: read

jobs:
  # Run quality checks first
  quality:
    name: Quality Gates
    # workflow_dispatch on non-release refs must not cut releases
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/beta' ||
      github.ref == 'refs/heads/alpha'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install dependencies
        run: uv sync --group dev --group test --group docs --group cli

      - name: Run tests
        run: uv run pytest tests -x -q --tb=short --override-ini="addopts="

      - name: Run type check
        run: uv run ty check --extra-search-path scripts --extra-search-path template scripts template/hooks src

      - name: Run linting
        run: uv run ruff check scripts template/hooks tests src

      - name: Build documentation
        run: uv run sphinx-build -W -b html docs docs/_build

  # Semantic release
  release:
    name: Semantic Release
    needs: quality
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/beta' ||
      github.ref == 'refs/heads/alpha'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install Python dependencies
        run: uv sync --group dev --group test --group cli

      - name: Build distribution
        run: uv build --no-sources

      - name: Check distribution metadata
        run: uv run --with twine twine check dist/*

      - name: Smoke test wheel install
        run: |
          WHEEL="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          uv run --isolated --with "$WHEEL" riso --help
          uv run --isolated --with "$WHEEL" riso doctor --json

      - name: Rehearse PyPI Trusted Publishing
        run: uv publish --dry-run --trusted-publishing automatic dist/*

      - name: Run Semantic Release (Dry Run)
        if: github.event.inputs.dry_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run release:dry

      - name: Run Semantic Release
        if: github.event.inputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run release

      - name: Upload release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: success()
        with:
          name: release-artifacts
          path: |
            CHANGELOG.md
            dist/
          if-no-files-found: warn
          retention-days: 90

      - name: Post release summary
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "Release completed successfully on branch: \`${{ github.ref_name }}\`"
            echo ""
            if [ -f CHANGELOG.md ]; then
              echo "### Recent Changes"
              head -50 CHANGELOG.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
