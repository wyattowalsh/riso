name: Quality Matrix

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  python-quality:
    name: Python Quality (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: ["standard", "strict"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Install uv
        run: pip install uv
      - name: Run quality suite
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: |
          uv run python scripts/ci/run_quality_suite.py \
            --profile "${{ matrix.profile }}" \
            --log-dir "quality-${{ matrix.profile }}"
      - name: Upload quality artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-${{ matrix.profile }}
          path: quality-${{ matrix.profile }}
          retention-days: 90

  aggregate-status:
    name: Aggregate Quality Status
    runs-on: ubuntu-latest
    needs: python-quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --group dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quality-standard
          path: artifacts/quality-standard
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quality-strict
          path: artifacts/quality-strict
      - name: Consolidate quality results
        run: |
          uv run python scripts/ci/render_matrix.py \
            --quality-only \
            --quality-artifacts \
              artifacts/quality-standard/quality-results.json \
              artifacts/quality-strict/quality-results.json \
            --retention-days 90
      - name: Upload consolidated summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-summary
          path: samples/metadata/quality_summary.json
          retention-days: 90
