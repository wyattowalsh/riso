name: Matrix Data

on:
  workflow_dispatch:
    inputs:
      skip_render:
        description: "Skip rendering samples and reuse existing metadata"
        type: boolean
        default: false
      open_pr:
        description: "Open a PR with updated matrix metadata"
        type: boolean
        default: true
  schedule:
    - cron: "0 7 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-matrix-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COPIER_CMD: ${{ github.workspace }}/.venv/bin/copier
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make

      - name: Install Python dependencies
        run: uv sync --group dev --group cli

      - name: Render sample matrix
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_render != 'true' }}
        run: uv run python scripts/ci/render_matrix.py

      - name: Generate matrix data snapshot
        run: uv run python scripts/ci/generate_matrix_data.py

      - name: Upload matrix data artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: matrix-data-${{ github.run_id }}
          path: |
            samples/metadata/matrix-data.json
            samples/metadata/render_matrix.json
            samples/metadata/module_success.json
          retention-days: 90

  open-matrix-data-pr:
    name: Open matrix data PR
    needs: generate-matrix-data
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.open_pr == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download matrix data artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: matrix-data-${{ github.run_id }}
          path: samples/metadata

      - name: Create pull request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          commit-message: "chore(matrix): refresh matrix data"
          title: "chore(matrix): refresh matrix data"
          body: "Updates aggregated matrix metadata and SSOT snapshot."
          branch: "automation/matrix-data"
          delete-branch: true
          add-paths: |
            samples/metadata/matrix-data.json
            samples/metadata/render_matrix.json
            samples/metadata/module_success.json
          labels: "automation,metadata"
