name: Matrix Data

on:
  workflow_dispatch:
    inputs:
      skip_render:
        description: "Skip rendering samples and reuse existing metadata"
        type: boolean
        default: false
      open_pr:
        description: "Open a PR with updated matrix metadata"
        type: boolean
        default: true
  schedule:
    - cron: "0 7 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-matrix-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COPIER_CMD: ${{ github.workspace }}/.venv/bin/copier
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.11.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "22"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make

      - name: Install Python dependencies
        run: uv sync --group dev --group cli

      - name: Render sample matrix
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_render != 'true' }}
        run: uv run python scripts/ci/render_matrix.py

      - name: Generate matrix data snapshot
        run: uv run python scripts/ci/generate_matrix_data.py

      - name: Upload matrix data artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-data-${{ github.run_id }}
          path: |
            samples/metadata/matrix-data.json
            samples/metadata/render_matrix.json
            samples/metadata/module_success.json
            web/src/data/matrix-data.json
          retention-days: 90

  open-matrix-data-pr:
    name: Open matrix data PR
    needs: generate-matrix-data
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.open_pr == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download matrix data artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: matrix-data-${{ github.run_id }}
          path: .

      - name: Create pull request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          commit-message: "chore(matrix): refresh matrix data"
          title: "chore(matrix): refresh matrix data"
          body: "Updates aggregated matrix metadata and SSOT snapshot."
          branch: "automation/matrix-data"
          delete-branch: true
          add-paths: |
            web/src/data/matrix-data.json
          labels: "automation,metadata"
