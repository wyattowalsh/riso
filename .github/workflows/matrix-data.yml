name: Matrix Data

on:
  workflow_dispatch:
    inputs:
      skip_render:
        description: "Skip rendering samples and reuse existing metadata"
        type: boolean
        default: false
      open_pr:
        description: "Open a PR with updated matrix metadata"
        type: boolean
        default: true
  schedule:
    - cron: "0 7 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-matrix-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COPIER_CMD: ${{ github.workspace }}/.venv/bin/copier
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "20"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make

      - name: Install Python dependencies
        run: uv sync --group dev --group cli

      - name: Render sample matrix
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_render != 'true' }}
        run: uv run python scripts/ci/render_matrix.py

      - name: Generate matrix data snapshot
        run: uv run python scripts/ci/generate_matrix_data.py

      - name: Upload matrix data artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: matrix-data-${{ github.run_id }}
          path: |
            samples/metadata/matrix-data.json
            samples/metadata/render_matrix.json
            samples/metadata/module_success.json
          retention-days: 90

  open-matrix-data-pr:
    name: Open matrix data PR
    needs: generate-matrix-data
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.open_pr == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download matrix data artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: matrix-data-${{ github.run_id }}
          path: samples/metadata

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(matrix): refresh matrix data"
          title: "chore(matrix): refresh matrix data"
          body: "Updates aggregated matrix metadata and SSOT snapshot."
          branch: "automation/matrix-data"
          delete-branch: true
          add-paths: |
            samples/metadata/matrix-data.json
            samples/metadata/render_matrix.json
            samples/metadata/module_success.json
          labels: "automation,metadata"
