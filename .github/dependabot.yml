# Dependabot configuration for automatic dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
# Maintainer-root only. Do not add dest/template jinja directories here.

version: 2
updates:
  # pip at / does not read uv.lock and is a weak signal for this repo.
  # Dependabot's uv ecosystem updates pyproject.toml + uv.lock together.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python-deps:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(actions)"
      include: "scope"

  # Root package.json (semantic-release, commit tooling)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      root-npm:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(npm)"
      include: "scope"

  # Web wizard (maintainer configurator)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      web-npm:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(web)"
      include: "scope"
