# Dependabot configuration for automatic dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Python dependencies (pip/uv)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python-deps:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(actions)"
      include: "scope"

  # Web wizard (maintainer configurator)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      web-npm:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(web)"
      include: "scope"

  # Root package.json if present
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      root-npm:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(npm)"
      include: "scope"
    # Ignore if no lockfile at root — Dependabot no-ops cleanly

  # Maintainer root (semantic-release, commit tooling)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      root-node-deps:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(node-root)"
      include: "scope"

  # Web configurator
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      web-deps:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(web)"
      include: "scope"

  # Node.js dependencies (for template files)
  - package-ecosystem: "npm"
    directory: "/template/files/node/saas"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      node-deps:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(node)"
      include: "scope"
