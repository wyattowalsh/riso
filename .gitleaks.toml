# Gitleaks configuration for the Riso maintainer repository.
# Extends defaults; path allowlists cover generated schema artifacts that
# use JSON "key" fields and trip generic-api-key (false positives).

title = "riso"

[extend]
useDefault = true

[allowlist]
description = "Generated schema/metadata files with non-secret key identifiers"
paths = [
  '''(^|/)web/src/data/matrix-data\.json$''',
  '''(^|/)samples/metadata/.*\.json$''',
]
